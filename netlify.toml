# Fayra Parfums · configuración de Netlify
# Las funciones viven en netlify/functions (detección automática).

[build]
  functions = "netlify/functions"

# Node 20 fijo: @netlify/blobs pide 18 o más. Sin esto el sitio usa el Node
# que tenga configurado en la imagen de build, y si ese es viejo el
# "npm install" falla y el deploy se cae entero.
[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Resumen semanal: lunes 9:00 am en El Salvador (UTC-6) = 15:00 UTC
[functions."weekly"]
  schedule = "0 15 * * 1"

# El panel no es un HTML suelto: lo sirve la función, que primero valida la
# clave. Si fuera panel.html, cualquiera con la dirección lo abriría.
[[redirects]]
  from = "/panel"
  to = "/.netlify/functions/panel"
  status = 200
  force = true
